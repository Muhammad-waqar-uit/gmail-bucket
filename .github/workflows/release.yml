name: Release

# Publishing is tag-driven: push a v* tag and this job ships it to npm.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # required for npm provenance (OIDC)

# Two tag pushes must not publish concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: DriveStore mock suite
        run: npm run test:drive

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          echo "tag:          $tag"
          echo "package.json: $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "Published gmail-bucket@$version" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/gmail-bucket/v/$version" >> "$GITHUB_STEP_SUMMARY"
